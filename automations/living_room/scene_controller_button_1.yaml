---
################################################################################
# Living Room Scene Controller Button 1
# Controls the cabinet lights
#
# https://www.home-assistant.io/docs/automation/yaml/
################################################################################
- id: living_room_scene_controller_button_1
  alias: Living Room Scene Controller Button 1
  description: >
    Actions for the living room scene controller button 1
  mode: single

  triggers:
    - trigger: event
      event_type: zwave_js_value_notification
      event_data:
        device_id: 59b5c0bd816769a4a1ba3eb95bb199c6
        property: scene
        property_key: "001"

  conditions: []

  actions:
    - choose:
        # KeyPressed
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.event.data.value == 'KeyPressed' }}
          sequence:
            - service: light.toggle
              target:
                entity_id: light.living_room_cabinet_lights

        # KeyHeldDown
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.event.data.value == 'KeyHeldDown' }}
            - condition: state
              entity_id: light.living_room_cabinet_lights
              state: "on"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.living_room_cabinet_lights
