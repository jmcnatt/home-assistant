---
################################################################################
# Living Room Scene Controller Relay
# Toggles the living_room_lights
#
# https://www.home-assistant.io/docs/automation/yaml/
################################################################################
- id: living_room_scene_controller_relay
  alias: Living Room Scene Controller Relay
  description: >
    Actions for the living room scene controller relay
  mode: single

  triggers:
    - trigger: state
      entity_id: switch.living_room_living_room_scene_controller

  conditions: []

  actions:
    - service: light.toggle
      target:
        entity_id: light.living_room_lights
