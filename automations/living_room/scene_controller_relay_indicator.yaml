---
################################################################################
# Living Room Scene Controller Relay Indicator
# Indicator is on when the living room lights are on
#
# https://www.home-assistant.io/docs/automation/yaml/
################################################################################
- id: living_room_scene_controller_relay_indicator
  alias: Living Room Scene Controller Relay Indicator
  description: >
    Controls the living_room_scene_controller relay indicator
  mode: restart

  triggers:
    - trigger: state
      entity_id: light.living_room_lights

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.to_state.state == 'on' }}
          sequence:
            - choose:
                - conditions:
                    - condition: not
                      conditions:
                        - condition: state
                          entity_id: select.living_room_scene_controller_relay_indicator_color
                          state: White
                  sequence:
                    - service: select.select_option
                      target:
                        entity_id: select.living_room_scene_controller_relay_indicator_color
                      data:
                        option: White
            - action: select.select_option
              target:
                entity_id: select.living_room_scene_controller_relay_indicator
              data:
                option: Always on

        - conditions:
            - condition: template
              value_template: >
                {{ trigger.to_state.state == 'off' }}
          sequence:
            - action: select.select_option
              target:
                entity_id: select.living_room_scene_controller_relay_indicator
              data:
                option: Always off
