---
################################################################################
# Living Room Scene Controller Button 1
# Controls the kitchen and dining room lights
#
# https://www.home-assistant.io/docs/automation/yaml/
################################################################################
- id: living_room_scene_controller_button_2
  alias: Living Room Scene Controller Button 2
  description: >
    Actions for the living room scene controller button 2
  mode: restart

  triggers:
    - trigger: event
      event_type: zwave_js_value_notification
      event_data:
        device_id: 59b5c0bd816769a4a1ba3eb95bb199c6
        property: scene
        property_key: "002"

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.event.data.value == 'KeyPressed' }}
          sequence:
            - service: light.toggle
              target:
                entity_id: light.kitchen_scene_controller

        - conditions:
            - condition: template
              value_template: >
                {{ trigger.event.data.value == 'KeyPressed2x' }}
          sequence:
            - service: light.toggle
              target:
                entity_id: light.dining_room_light

        - conditions:
            - condition: template
              value_template: >
                {{ trigger.event.data.value == 'KeyHeldDown' }}
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.dining_room_light
                      state: "on"
                  sequence:
                    - service: light.turn_off
                      entity_id: light.dining_room_light
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.living_room_lights
                      state: "on"
                  sequence:
                    - service: light.turn_off
                      entity_id: light.living_room_lights
            - choose:
                - conditions:
                    - condition: state
                      entity_id: light.kitchen_scene_controller
                      state: "on"
                  sequence:
                    - service: light.turn_off
                      entity_id: light.kitchen_scene_controller
