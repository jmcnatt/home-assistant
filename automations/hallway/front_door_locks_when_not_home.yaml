---
################################################################################
# Front Door Locks When Not Home
#
# https://www.home-assistant.io/docs/automation/yaml/
################################################################################
- id: front_door_locks_when_not_home
  alias: Front Door Locks When Not Home
  description: >
    Locks the front door if unlocked if no one is home for 15 minutes
  mode: single

  triggers:
    - trigger: state
      entity_id: zone.home
      to: "0"
      for:
        minutes: 15

  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: lock.front_door
          state: locked

  actions:
    - action: lock.lock
      target:
        entity_id: lock.front_door
    - wait_template: "{{ is_state('lock.front_door', 'locked') }}"
      timeout:
        seconds: 15
      continue_on_timeout: false
    - action: notify.all_mobile_devices
      data:
        title: Front Door Locked
        message: Home Assistant has automatically locked the front door.
