---
################################################################################
# Template for outside rear lights
#
# https://www.home-assistant.io/integrations/template/#light
################################################################################
- light:
    - name: Outside Rear Lights
      unique_id: outside_rear_lights
      icon: mdi:outdoor-lamp
      availability: "{{ has_value('switch.outside_rear_lights') }}"
      state: "{{ is_state('switch.outside_rear_lights', 'on') }}"
      turn_on:
        - action: switch.turn_on
          target:
            entity_id: switch.outside_rear_lights
      turn_off:
        - action: switch.turn_off
          target:
            entity_id: switch.outside_rear_lights
